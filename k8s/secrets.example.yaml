# Copy to secrets.yaml (gitignored) and fill values, or create via:
#   kubectl create secret generic briefly-web-env -n briefly \
#     --from-literal=NEXT_PUBLIC_SUPABASE_URL=... \
#     --from-literal=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: briefly-web-env
  namespace: briefly
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "YOUR_PUBLISHABLE_KEY"
